name: Watcher

# Daily puzzles are reserved two years ahead; this only fires when runs have stopped for about a year.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install "jsonschema>=4.23"

      - name: Count daily puzzles left
        id: left
        run: |
          if ! python tools/validate.py --days-left 365 > left.txt; then echo "short=1" >> "$GITHUB_OUTPUT"; fi
          cat left.txt

      - name: Open an issue
        if: steps.left.outputs.short == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily puzzles running low"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            { echo "Fewer than 365 daily puzzles left. Run the monthly generator (see the wikihop repo)."; echo;
              cat left.txt; } > body.md
            gh issue create --title "$title" --body-file body.md
          fi
